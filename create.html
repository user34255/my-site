<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Написать историю</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        @font-face {
            font-family: 'basis33';
            src: url('basis33.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'basis33', 'Press Start 2P', monospace;
            overflow: hidden;
            background-color: #0f141c;
            position: relative;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        body.loaded { opacity: 1; }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('f.png') no-repeat center center fixed;
            background-size: cover;
            filter: blur(10px);
            transform: scale(1.05);
            z-index: -1;
        }

        /* ── Навигация ─────────────────────────────────────── */
        .top-nav-zone {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 50px;
            z-index: 9999;
        }

        .navbar-container {
            position: fixed;
            top: -160px;
            left: 50%;
            transform: translateX(-50%);
            width: 940px;
            padding: 20px 35px;
            border-radius: 0 0 60px 60px;
            background: linear-gradient(160deg,
                rgba(255,255,255,0.14) 0%,
                rgba(255,255,255,0.05) 45%,
                rgba(255,255,255,0.01) 100%
            );
            backdrop-filter: blur(14px) saturate(1.5);
            -webkit-backdrop-filter: blur(14px) saturate(1.5);
            border: 1px solid rgba(255,255,255,0.18);
            border-top: none;
            box-shadow:
                0 24px 50px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.22),
                inset 1px 0 0 rgba(255,255,255,0.07),
                inset -1px 0 0 rgba(255,255,255,0.07);
            transition: top 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.12);
            z-index: 10000;
        }

        .top-nav-zone:hover + .navbar-container,
        .navbar-container:hover { top: 0; }

        .navbar-inner {
            background: #00969d;
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 25px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 62px; height: 62px;
            border-radius: 50%;
            cursor: pointer;
            color: rgba(255,255,255,0.75);
            transition:
                background 0.28s ease,
                border-color 0.28s ease,
                box-shadow 0.28s ease,
                transform 0.3s cubic-bezier(0.34,1.5,0.64,1);
            border: 1px solid transparent;
            background: transparent;
            text-decoration: none;
        }

        .nav-item svg {
            width: 28px; height: 28px;
            display: block;
            transition: filter 0.28s ease, color 0.28s ease;
        }

        .nav-spacer {
            flex-shrink: 0;
            width: 320px; height: 62px;
            background: #007c85;
            border-radius: 35px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.25);
        }

        .nav-item:hover, .nav-item.active {
            background: linear-gradient(145deg, rgba(255,255,255,0.30), rgba(255,255,255,0.08));
            backdrop-filter: blur(10px) saturate(1.6);
            -webkit-backdrop-filter: blur(10px) saturate(1.6);
            border: 1px solid rgba(255,255,255,0.38);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.40),
                inset 0 -1px 0 rgba(0,0,0,0.10),
                0 6px 16px rgba(0,0,0,0.20);
            transform: scale(1.06);
            color: #ffffff;
        }

        .nav-item:hover svg, .nav-item.active svg {
            color: #ffffff;
            filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px rgba(255,255,255,0.9));
        }

        /* ── Карточка ──────────────────────────────────────── */
        .create-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(145deg,
                rgba(255,255,255,0.10) 0%,
                rgba(255,255,255,0.04) 50%,
                rgba(255,255,255,0.01) 100%
            );
            backdrop-filter: blur(14px) saturate(1.5);
            -webkit-backdrop-filter: blur(14px) saturate(1.5);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 60px;
            padding: 44px 60px;
            box-shadow:
                0 32px 70px rgba(0,0,0,0.38),
                0 0 0 1px rgba(255,255,255,0.06),
                inset 0 1px 0 rgba(255,255,255,0.24),
                inset 0 -2px 0 rgba(0,0,0,0.14);
            width: 800px;
            max-width: 95%;
            display: flex;
            flex-direction: column;
            gap: 22px;
            animation: cardIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both;
            animation-delay: 0.15s;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Заголовок ─────────────────────────────────────── */
        .card-title {
            font-size: 30px;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* ── Строка пользователя ───────────────────────────── */
        .user-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 42px; height: 42px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00969d;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .user-avatar svg { width: 22px; height: 22px; }

        .user-nick {
            font-size: 38px;
            color: #00a4ad;
            font-weight: normal;
        }

        /* ── Поле дата + текст ─────────────────────────────── */
        .text-row {
            display: flex;
            align-items: stretch;
            background: #ffffff;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.18);
        }

        .date-input {
            width: 160px;
            flex-shrink: 0;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'basis33', 'Press Start 2P', monospace;
            font-size: 18px;
            color: #00878f;
            text-align: center;
            text-transform: uppercase;
            caret-color: #00878f;
            padding: 18px 0;
        }

        .date-input::placeholder { color: #00878f; opacity: 0.75; }
        .date-input:focus::placeholder { opacity: 0.30; }

        .divider {
            width: 2px;
            background: rgba(0,135,143,0.2);
            margin: 12px 0;
            flex-shrink: 0;
        }

        .text-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'basis33', 'Press Start 2P', monospace;
            font-size: 18px;
            color: #00878f;
            caret-color: #00878f;
            padding: 18px 24px;
            text-transform: uppercase;
            resize: none;
            min-height: 58px;
            max-height: 110px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .text-input::placeholder { color: #00878f; opacity: 0.75; }
        .text-input:focus::placeholder { opacity: 0.30; }

        /* ── Медиа-кнопки ──────────────────────────────────── */
        .media-row {
            display: flex;
            justify-content: center;
            gap: 26px;
        }

        .media-box {
            background: #ffffff;
            color: #000000;
            font-family: 'Press Start 2P', monospace;
            font-size: 44px;
            font-weight: bold;
            width: 280px;
            height: 140px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition:
                transform 0.25s cubic-bezier(0.34,1.5,0.64,1),
                box-shadow 0.25s ease;
        }

        .media-box:hover {
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.22), 0 0 20px rgba(0,150,157,0.30);
        }

        /* Скрытый file input */
        .media-box input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            font-size: 0;
            z-index: 2;
        }

        /* Превью фото */
        .photo-preview {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 32px;
            display: none;
            z-index: 1;
        }

        .photo-preview.visible { display: block; }

        .photo-label {
            position: absolute;
            bottom: 8px; right: 10px;
            font-family: 'basis33', monospace;
            font-size: 13px;
            color: rgba(255,255,255,0.92);
            background: rgba(0,150,157,0.76);
            border-radius: 20px;
            padding: 3px 10px;
            pointer-events: none;
            display: none;
            z-index: 3;
        }

        .photo-label.visible { display: block; }

        /* ── YouTube поле ──────────────────────────────────── */
        .youtube-wrapper {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .youtube-wrapper.open { display: flex; }

        .youtube-input-row {
            display: flex;
            align-items: stretch;
            background: #ffffff;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.18);
        }

        .youtube-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'basis33', 'Press Start 2P', monospace;
            font-size: 15px;
            color: #00878f;
            caret-color: #00878f;
            padding: 16px 24px;
        }

        .youtube-input::placeholder { color: #00878f; opacity: 0.72; }
        .youtube-input:focus::placeholder { opacity: 0.30; }

        .youtube-ok-btn {
            background: #00969d;
            border: none;
            cursor: pointer;
            padding: 0 28px;
            color: #fff;
            font-family: 'basis33', monospace;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.25s ease;
            flex-shrink: 0;
        }

        .youtube-ok-btn:hover { background: #00b0b8; }

        .yt-embed {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 28px;
            border: none;
            display: none;
        }

        .yt-embed.visible { display: block; }

        /* ── Кнопка опубликовать ───────────────────────────── */
        .publish-row {
            display: flex;
            justify-content: flex-end;
        }

        .publish-btn {
            background: #00969d;
            border: none;
            border-radius: 50px;
            padding: 16px 52px;
            font-family: 'basis33', 'Press Start 2P', monospace;
            font-size: 20px;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(0,150,157,0.42);
            transition:
                background 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.28s cubic-bezier(0.34,1.5,0.64,1);
        }

        .publish-btn:hover {
            background: #00b0b8;
            box-shadow: 0 8px 32px rgba(0,150,157,0.60);
            transform: translateY(-2px);
        }

        .publish-btn:active { transform: translateY(0); }
    </style>
    <script>
        (function(){
            var r = localStorage.getItem('role');
            if (!r) { window.location.replace('index.html'); return; }
        if (r === 'viewer') { window.location.replace('news.html'); }
        })();
    </script>
</head>
<body>

    <div class="top-nav-zone"></div>

    <div class="navbar-container">
        <div class="navbar-inner">
            <a href="search.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
            <a href="news.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></svg></a>
            <div class="nav-spacer"></div>
            <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg></div>
            <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        </div>
    </div>

    <div class="create-card">

        <div class="card-title">Написать историю</div>

        <div class="user-row">
            <div class="user-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </div>
            <div class="user-nick">Ник</div>
        </div>

        <div class="text-row">
            <input class="date-input" type="text" placeholder="ДД.ММ.ГГ" maxlength="8" id="dateInput" spellcheck="false" autocomplete="off">
            <div class="divider"></div>
            <textarea class="text-input" placeholder="НАПИШИТЕ ТЕКСТ." spellcheck="false" rows="1" id="textInput"></textarea>
        </div>

        <div class="media-row">
            <div class="media-box" id="photoBox">
                ФОТО
                <input type="file" accept="image/*" id="photoInput" title="">
                <img class="photo-preview" id="photoPreview" alt="">
                <span class="photo-label" id="photoLabel">✓ загружено</span>
            </div>

            <div class="media-box" id="videoBox" onclick="toggleYoutube()">
                ВИДЕО
            </div>
        </div>

        <div class="youtube-wrapper" id="youtubeWrapper">
            <div class="youtube-input-row">
                <input class="youtube-input" type="text" id="youtubeInput" placeholder="Вставьте ссылку на YouTube" autocomplete="off">
                <button class="youtube-ok-btn" onclick="embedYoutube()">ОК</button>
            </div>
            <iframe class="yt-embed" id="ytEmbed" allowfullscreen></iframe>
        </div>

        <div class="publish-row">
            <button class="publish-btn">ОПУБЛИКОВАТЬ</button>
        </div>

    </div>

    <script>
        window.addEventListener('load', () => {
            requestAnimationFrame(() => document.body.classList.add('loaded'));
        });

        document.querySelectorAll('a[href]').forEach(link => {
            link.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('http') && !href.startsWith('mailto')) {
                    e.preventDefault();
                    document.body.style.transition = 'opacity 0.3s ease';
                    document.body.style.opacity = '0';
                    setTimeout(() => { window.location.href = href; }, 310);
                }
            });
        });

        // Автоформат даты
        document.getElementById('dateInput').addEventListener('input', function () {
            let v = this.value.replace(/\D/g, '');
            if (v.length > 2) v = v.slice(0,2) + '.' + v.slice(2);
            if (v.length > 5) v = v.slice(0,5) + '.' + v.slice(5);
            this.value = v.slice(0, 8);
        });

        // Авторастяжение textarea
        const ta = document.getElementById('textInput');
        ta.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 110) + 'px';
        });

        // Загрузка фото
        document.getElementById('photoInput').addEventListener('change', function () {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const preview = document.getElementById('photoPreview');
                const label   = document.getElementById('photoLabel');
                preview.src = e.target.result;
                preview.classList.add('visible');
                label.classList.add('visible');
                document.getElementById('photoBox').style.color = 'transparent';
            };
            reader.readAsDataURL(file);
        });

        // Открыть/скрыть поле YouTube
        function toggleYoutube() {
            const w = document.getElementById('youtubeWrapper');
            w.classList.toggle('open');
            if (w.classList.contains('open')) {
                setTimeout(() => document.getElementById('youtubeInput').focus(), 50);
            }
        }

        // Встроить YouTube плеер
        function embedYoutube() {
            const raw = document.getElementById('youtubeInput').value.trim();
            if (!raw) return;
            let id = null;
            try {
                const url = new URL(raw);
                if (url.hostname.includes('youtu.be')) {
                    id = url.pathname.slice(1);
                } else {
                    id = url.searchParams.get('v');
                }
            } catch (e) {
                if (/^[\w-]{11}$/.test(raw)) id = raw;
            }
            if (!id) return;
            const iframe = document.getElementById('ytEmbed');
            iframe.src = 'https://www.youtube.com/embed/' + id;
            iframe.classList.add('visible');
            document.getElementById('videoBox').style.color = 'transparent';
        }
    </script>
</body>
</html>
