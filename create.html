<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Написать историю</title>
    <script>
        (function(){
            var r = localStorage.getItem('role');
            if (!r) { window.location.replace('index.html'); return; }
            if (r === 'viewer') { window.location.replace('news.html'); return; }
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @font-face { font-family:'basis33'; src:url('basis33.ttf') format('truetype'); }
        * { box-sizing:border-box; margin:0; padding:0; }

        body {
            height:100vh; display:flex; justify-content:center; align-items:center;
            font-family:'basis33','Press Start 2P',monospace; overflow:hidden;
            background-color:#0f141c; position:relative;
            opacity:0; transition:opacity 0.4s ease;
        }
        body.loaded { opacity:1; }
        body::before {
            content:""; position:fixed; top:0; left:0; width:100%; height:100%;
            background:url('f.png') no-repeat center center fixed;
            background-size:cover; filter:blur(10px); transform:scale(1.05); z-index:-1;
        }

        /* ── Навигация ───────────────────────────────── */
        .top-nav-zone { position:fixed; top:0; left:0; width:100%; height:50px; z-index:9999; }
        .navbar-container {
            position:fixed; top:-160px; left:50%; transform:translateX(-50%);
            width:940px; padding:20px 35px; border-radius:0 0 60px 60px;
            background:linear-gradient(160deg,rgba(255,255,255,0.14) 0%,rgba(255,255,255,0.05) 45%,rgba(255,255,255,0.01) 100%);
            backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.18); border-top:none;
            box-shadow:0 24px 50px rgba(0,0,0,0.38),inset 0 1px 0 rgba(255,255,255,0.22);
            transition:top 0.45s cubic-bezier(0.175,0.885,0.32,1.12); z-index:10000;
        }
        .top-nav-zone:hover + .navbar-container, .navbar-container:hover { top:0; }
        .navbar-inner {
            background:#00969d; border-radius:48px; display:flex; align-items:center;
            justify-content:space-between; padding:10px 25px; width:100%;
            box-shadow:inset 0 3px 6px rgba(0,0,0,0.3);
        }
        .nav-item {
            display:flex; align-items:center; justify-content:center;
            width:62px; height:62px; border-radius:50%; cursor:pointer;
            color:rgba(255,255,255,0.75);
            transition:background 0.28s,border-color 0.28s,box-shadow 0.28s,transform 0.3s cubic-bezier(0.34,1.5,0.64,1);
            border:1px solid transparent; background:transparent; text-decoration:none;
        }
        .nav-item svg { width:28px; height:28px; display:block; transition:filter 0.28s,color 0.28s; }
        .nav-spacer { flex-shrink:0; width:320px; height:62px; background:#007c85; border-radius:35px; box-shadow:inset 0 3px 6px rgba(0,0,0,0.25); }
        .nav-item:hover,.nav-item.active {
            background:linear-gradient(145deg,rgba(255,255,255,0.30),rgba(255,255,255,0.08));
            backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.38);
            box-shadow:inset 0 1px 0 rgba(255,255,255,0.40),0 6px 16px rgba(0,0,0,0.20);
            transform:scale(1.06); color:#fff;
        }
        .nav-item:hover svg,.nav-item.active svg { color:#fff; filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px rgba(255,255,255,0.9)); }

        /* ── Карточка ────────────────────────────────── */
        .create-card {
            position:relative; z-index:10;
            background:linear-gradient(145deg,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0.04) 50%,rgba(255,255,255,0.01) 100%);
            backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.18); border-radius:60px; padding:44px 60px;
            box-shadow:0 32px 70px rgba(0,0,0,0.38),0 0 0 1px rgba(255,255,255,0.06),inset 0 1px 0 rgba(255,255,255,0.24);
            width:800px; max-width:95%; display:flex; flex-direction:column; gap:22px;
            animation:cardIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both; animation-delay:0.15s;
            max-height:95vh; overflow-y:auto;
        }
        .create-card::-webkit-scrollbar { width:4px; }
        .create-card::-webkit-scrollbar-thumb { background:rgba(0,150,157,0.4); border-radius:4px; }
        @keyframes cardIn { from{opacity:0;transform:translateY(18px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }

        .card-title { font-size:30px; color:#fff; letter-spacing:2px; text-transform:uppercase; font-weight:normal; }

        /* ── Автор ───────────────────────────────────── */
        .user-row { display:flex; align-items:center; gap:12px; }
        .user-avatar {
            width:42px; height:42px; background:#fff; border-radius:50%;
            display:flex; align-items:center; justify-content:center; color:#00969d;
            flex-shrink:0; box-shadow:0 4px 10px rgba(0,0,0,0.15); overflow:hidden;
        }
        .user-avatar img { width:100%; height:100%; object-fit:cover; }
        .user-avatar svg { width:22px; height:22px; }
        .user-nick { font-size:38px; color:#00a4ad; font-weight:normal; }

        /* ── Поля ────────────────────────────────────── */
        .text-row {
            display:flex; align-items:stretch; background:#fff; border-radius:50px;
            overflow:hidden; box-shadow:inset 0 4px 8px rgba(0,0,0,0.18);
            transition:box-shadow 0.3s ease;
        }
        .text-row:focus-within { box-shadow:inset 0 4px 8px rgba(0,0,0,0.18),0 0 0 3px rgba(0,150,157,0.28); }
        .date-input {
            width:160px; flex-shrink:0; border:none; outline:none; background:transparent;
            font-family:'basis33','Press Start 2P',monospace; font-size:18px; color:#00878f;
            text-align:center; text-transform:uppercase; caret-color:#00878f; padding:18px 0;
        }
        .date-input::placeholder { color:#00878f; opacity:0.75; }
        .divider { width:2px; background:rgba(0,135,143,0.2); margin:12px 0; flex-shrink:0; }
        .text-input {
            flex:1; border:none; outline:none; background:transparent;
            font-family:'basis33','Press Start 2P',monospace; font-size:18px; color:#00878f;
            caret-color:#00878f; padding:18px 24px; text-transform:uppercase;
            resize:none; min-height:58px; max-height:120px; overflow-y:auto; line-height:1.4;
        }
        .text-input::placeholder { color:#00878f; opacity:0.75; }

        /* ── Медиа кнопки ────────────────────────────── */
        .media-row { display:flex; justify-content:center; gap:26px; }
        .media-box {
            background:#fff; color:#000; font-family:'Press Start 2P',monospace;
            font-size:44px; font-weight:bold; width:280px; height:140px; border-radius:32px;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 14px rgba(0,0,0,0.15); cursor:pointer; position:relative; overflow:hidden;
            transition:transform 0.25s cubic-bezier(0.34,1.5,0.64,1),box-shadow 0.25s ease;
        }
        .media-box:hover { transform:scale(1.04) translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,0.22),0 0 20px rgba(0,150,157,0.30); }
        .media-box input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; z-index:2; }
        .media-box img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:32px; display:none; z-index:1; }
        .media-box img.visible { display:block; }
        .media-box-label {
            position:absolute; bottom:8px; right:10px; font-family:'basis33',monospace; font-size:13px;
            color:rgba(255,255,255,0.92); background:rgba(0,150,157,0.76); border-radius:20px;
            padding:3px 10px; pointer-events:none; display:none; z-index:3;
        }
        .media-box-label.visible { display:block; }
        .media-box-text { z-index:0; transition:opacity 0.2s; }

        /* ── YouTube поле ────────────────────────────── */
        .youtube-wrapper { display:none; flex-direction:column; gap:10px; }
        .youtube-wrapper.open { display:flex; }
        .youtube-input-row {
            display:flex; align-items:stretch; background:#fff; border-radius:50px;
            overflow:hidden; box-shadow:inset 0 4px 8px rgba(0,0,0,0.18);
        }
        .youtube-input {
            flex:1; border:none; outline:none; background:transparent;
            font-family:'basis33','Press Start 2P',monospace; font-size:15px;
            color:#00878f; caret-color:#00878f; padding:16px 24px;
        }
        .youtube-input::placeholder { color:#00878f; opacity:0.72; }
        .youtube-ok-btn {
            background:#00969d; border:none; cursor:pointer; padding:0 28px; color:#fff;
            font-family:'basis33',monospace; font-size:18px; letter-spacing:1px; text-transform:uppercase;
            transition:background 0.25s; flex-shrink:0;
        }
        .youtube-ok-btn:hover { background:#00b0b8; }
        .yt-preview { width:100%; aspect-ratio:16/9; border-radius:28px; border:none; display:none; }
        .yt-preview.visible { display:block; }
        .yt-error {
            display:none; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
            border-radius:28px; padding:18px 24px; font-size:16px; color:rgba(255,255,255,0.7);
            text-align:center; letter-spacing:1px; text-transform:uppercase;
        }
        .yt-error.visible { display:block; }

        /* ── Публикация ──────────────────────────────── */
        .publish-row { display:flex; justify-content:flex-end; align-items:center; gap:16px; }
        .publish-status { font-family:'basis33',monospace; font-size:16px; color:rgba(255,255,255,0.6); letter-spacing:1px; }
        .publish-btn {
            background:#00969d; border:none; border-radius:50px; padding:16px 52px;
            font-family:'basis33','Press Start 2P',monospace; font-size:20px; letter-spacing:2px;
            color:#fff; text-transform:uppercase; cursor:pointer;
            box-shadow:0 6px 22px rgba(0,150,157,0.42);
            transition:background 0.25s,box-shadow 0.25s,transform 0.28s cubic-bezier(0.34,1.5,0.64,1);
        }
        .publish-btn:hover:not(:disabled) { background:#00b0b8; box-shadow:0 8px 32px rgba(0,150,157,0.60); transform:translateY(-2px); }
        .publish-btn:disabled { opacity:0.55; cursor:not-allowed; transform:none; }
    </style>
</head>
<body>
    <div class="top-nav-zone"></div>
    <div class="navbar-container">
        <div class="navbar-inner">
            <a href="search.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
            <a href="news.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></a>
            <div class="nav-spacer"></div>
            <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></div>
            <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        </div>
    </div>

    <div class="create-card" id="createCard">
        <div class="card-title" id="cardTitle">Написать историю</div>

        <div class="user-row">
            <div class="user-avatar" id="userAvatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="user-nick" id="userNick">Загрузка...</div>
        </div>

        <div class="text-row">
            <input class="date-input" type="text" placeholder="ДД.ММ.ГГ" maxlength="8" id="dateInput" spellcheck="false" autocomplete="off">
            <div class="divider"></div>
            <textarea class="text-input" placeholder="НАПИШИТЕ ТЕКСТ." spellcheck="false" rows="1" id="textInput"></textarea>
        </div>

        <div class="media-row">
            <div class="media-box" id="photoBox">
                <span class="media-box-text" id="photoText">ФОТО</span>
                <input type="file" accept="image/*" id="photoInput" title="">
                <img id="photoPreview" alt="">
                <span class="media-box-label" id="photoLabel">✓ загружено</span>
            </div>
            <div class="media-box" id="videoBox" onclick="toggleYoutube()">
                <span class="media-box-text" id="videoText">ВИДЕО</span>
            </div>
        </div>

        <div class="youtube-wrapper" id="youtubeWrapper">
            <div class="youtube-input-row">
                <input class="youtube-input" type="text" id="youtubeInput" placeholder="Вставьте ссылку на YouTube" autocomplete="off">
                <button class="youtube-ok-btn" onclick="embedYoutube()">ОК</button>
            </div>
            <iframe class="yt-preview" id="ytEmbed" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <div class="yt-error" id="ytError">⚠ Автор видео запретил встраивание. <a id="ytLink" href="#" target="_blank" style="color:#00a4ad">Открыть на YouTube →</a></div>
        </div>

        <div class="publish-row">
            <span class="publish-status" id="publishStatus"></span>
            <button class="publish-btn" id="publishBtn" onclick="publishPost()">ОПУБЛИКОВАТЬ</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const user = getCurrentUser();
        let photoFile = null;
        let videoUrl  = null;
        let editPostId = null;
        let editCreatedAt = null;

        // ── Инициализация ─────────────────────────────
        window.addEventListener('load', () => {
            requestAnimationFrame(() => document.body.classList.add('loaded'));
            if (!user) { goTo('index.html'); return; }

            // Показать аватар и ник
            const avatarEl = document.getElementById('userAvatar');
            if (user.avatar_url) {
                avatarEl.innerHTML = `<img src="${user.avatar_url}" alt="">`;
            }
            document.getElementById('userNick').textContent = user.nickname;

            // Проверяем режим редактирования
            const params = new URLSearchParams(location.search);
            editPostId = params.get('edit');
            if (editPostId) loadPostForEdit(editPostId);
        });

        // ── Загрузить пост для редактирования ────────
        async function loadPostForEdit(id) {
            try {
                const posts = await sbSelect('posts', `id=eq.${id}&select=*`);
                if (!posts.length) return;
                const p = posts[0];

                // Проверка: только автор может редактировать
                if (p.author_id !== user.id) { goTo('news.html'); return; }

                // Проверка: не более 3 часов
                const age = Date.now() - new Date(p.created_at).getTime();
                if (age > 3 * 60 * 60 * 1000) {
                    document.getElementById('publishStatus').textContent = 'Редактирование закрыто (прошло более 3 часов)';
                    document.getElementById('publishBtn').disabled = true;
                    return;
                }

                editCreatedAt = p.created_at;
                document.getElementById('cardTitle').textContent = 'Редактировать историю';
                document.getElementById('dateInput').value = p.date || '';
                const ta = document.getElementById('textInput');
                ta.value = p.text || '';
                ta.style.height = 'auto';
                ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
                if (p.video_url) {
                    videoUrl = p.video_url;
                    document.getElementById('videoText').style.color = '#00969d';
                }

                // Загрузить фото
                const photos = await sbSelect('photos', `post_id=eq.${id}&select=url`);
                if (photos.length) {
                    const url = photos[0].url;
                    document.getElementById('photoPreview').src = url;
                    document.getElementById('photoPreview').classList.add('visible');
                    document.getElementById('photoLabel').classList.add('visible');
                    document.getElementById('photoText').style.opacity = '0';
                }
            } catch(e) { console.error(e); }
        }

        // ── Навигация ─────────────────────────────────
        document.querySelectorAll('a[href]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('http') && !href.startsWith('mailto')) {
                    e.preventDefault(); goTo(href);
                }
            });
        });

        // ── Автоформат даты ───────────────────────────
        document.getElementById('dateInput').addEventListener('input', function() {
            let v = this.value.replace(/\D/g,'');
            if (v.length > 2) v = v.slice(0,2) + '.' + v.slice(2);
            if (v.length > 5) v = v.slice(0,5) + '.' + v.slice(5);
            this.value = v.slice(0,8);
        });

        // ── Авторастяжение textarea ───────────────────
        document.getElementById('textInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ── Фото ──────────────────────────────────────
        document.getElementById('photoInput').addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            photoFile = file;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('photoPreview').src = e.target.result;
                document.getElementById('photoPreview').classList.add('visible');
                document.getElementById('photoLabel').classList.add('visible');
                document.getElementById('photoText').style.opacity = '0';
            };
            reader.readAsDataURL(file);
        });

        // ── YouTube ───────────────────────────────────
        function toggleYoutube() {
            const w = document.getElementById('youtubeWrapper');
            w.classList.toggle('open');
            if (w.classList.contains('open')) setTimeout(() => document.getElementById('youtubeInput').focus(), 50);
        }

        function extractYTId(raw) {
            try {
                const url = new URL(raw);
                if (url.hostname.includes('youtu.be')) return url.pathname.slice(1).split('?')[0];
                return url.searchParams.get('v') || '';
            } catch { return /^[\w-]{11}$/.test(raw) ? raw : ''; }
        }

        function embedYoutube() {
            const raw = document.getElementById('youtubeInput').value.trim();
            const id  = extractYTId(raw);
            if (!id) return;
            videoUrl = raw;
            const iframe = document.getElementById('ytEmbed');
            const err    = document.getElementById('ytError');
            iframe.src = 'https://www.youtube.com/embed/' + id + '?enablejsapi=1';
            iframe.classList.add('visible');
            err.classList.remove('visible');
            document.getElementById('ytLink').href = 'https://www.youtube.com/watch?v=' + id;
            document.getElementById('videoText').style.color = '#00969d';

            // Определяем ошибку встраивания
            window.addEventListener('message', function handler(e) {
                if (!e.origin.includes('youtube.com')) return;
                try {
                    const d = JSON.parse(e.data);
                    if (d.event === 'onError' && [101,150,153].includes(d.info)) {
                        iframe.classList.remove('visible');
                        err.classList.add('visible');
                    }
                } catch {}
                window.removeEventListener('message', handler);
            });
        }

        // ── Загрузка фото в Supabase Storage ─────────
        async function uploadPhotoToStorage(file) {
            const compressed = await compressImage(file, 1200);
            const fileName   = `posts/${user.id}_${Date.now()}.jpg`;
            const url        = `${CONFIG.supabase.url}/storage/v1/object/photos/${fileName}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + CONFIG.supabase.anon,
                    'apikey': CONFIG.supabase.anon,
                    'Content-Type': 'image/jpeg',
                    'x-upsert': 'true'
                },
                body: compressed
            });
            if (!res.ok) throw new Error(await res.text());
            return `${CONFIG.supabase.url}/storage/v1/object/public/photos/${fileName}`;
        }

        // ── Публикация ────────────────────────────────
        async function publishPost() {
            const date = document.getElementById('dateInput').value.trim();
            const text = document.getElementById('textInput').value.trim();
            if (!date && !text && !photoFile && !videoUrl) {
                document.getElementById('publishStatus').textContent = 'Заполните хотя бы одно поле';
                return;
            }

            const btn = document.getElementById('publishBtn');
            const status = document.getElementById('publishStatus');
            btn.disabled = true;
            status.textContent = 'Публикация...';

            try {
                let photoUrl = null;

                // Загрузить фото если есть
                if (photoFile) {
                    status.textContent = 'Загрузка фото...';
                    photoUrl = await uploadPhotoToStorage(photoFile);
                }

                if (editPostId) {
                    // ── Редактирование ─────────────────
                    await sbUpdate('posts', `id=eq.${editPostId}`, { date, text, video_url: videoUrl || null });
                    if (photoFile && photoUrl) {
                        // Удалить старые фото и добавить новое
                        await sbDelete('photos', `post_id=eq.${editPostId}`);
                        await sbInsert('photos', { post_id: editPostId, url: photoUrl });
                    }
                    status.textContent = '✓ Сохранено!';
                } else {
                    // ── Новый пост ─────────────────────
                    const post = await sbInsert('posts', {
                        author_id:     user.id,
                        author_nick:   user.nickname,
                        author_avatar: user.avatar_url || null,
                        date, text,
                        video_url: videoUrl || null
                    });
                    if (photoUrl && post[0]) {
                        await sbInsert('photos', { post_id: post[0].id, url: photoUrl });
                    }
                    status.textContent = '✓ Опубликовано!';
                }

                setTimeout(() => goTo('news.html'), 1000);

            } catch(err) {
                console.error(err);
                status.textContent = 'Ошибка: ' + (err.message || 'попробуй снова');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
