<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои медиа</title>
    <script>
        (function(){
            var r = localStorage.getItem('role');
            if (!r) { window.location.replace('index.html'); }
            if (r === 'viewer') { window.location.replace('news.html'); }
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @font-face { font-family:'basis33'; src:url('basis33.ttf') format('truetype'); }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {
            height:100vh; display:flex; justify-content:center; align-items:center;
            font-family:'basis33',sans-serif; overflow:hidden;
            background-color:#0f141c; position:relative;
            opacity:0; transition:opacity 0.4s ease;
        }
        body.loaded { opacity:1; }
        body::before {
            content:""; position:fixed; top:0; left:0; width:100%; height:100%;
            background:url('f.png') no-repeat center center fixed;
            background-size:cover; filter:blur(10px); transform:scale(1.05); z-index:-1;
        }
        .top-nav-zone { position:fixed; top:0; left:0; width:100%; height:50px; z-index:9999; }
        .navbar-container {
            position:fixed; top:-160px; left:50%; transform:translateX(-50%);
            width:940px; padding:20px 35px; border-radius:0 0 60px 60px;
            background:linear-gradient(160deg,rgba(255,255,255,0.14) 0%,rgba(255,255,255,0.05) 45%,rgba(255,255,255,0.01) 100%);
            backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.18); border-top:none;
            box-shadow:0 24px 50px rgba(0,0,0,0.38),inset 0 1px 0 rgba(255,255,255,0.22);
            transition:top 0.45s cubic-bezier(0.175,0.885,0.32,1.12); z-index:10000;
        }
        .top-nav-zone:hover + .navbar-container, .navbar-container:hover { top:0; }
        .navbar-inner {
            background:#00969d; border-radius:48px; display:flex; align-items:center;
            justify-content:space-between; padding:10px 25px; width:100%;
            box-shadow:inset 0 3px 6px rgba(0,0,0,0.3);
        }
        .nav-item {
            display:flex; align-items:center; justify-content:center;
            width:62px; height:62px; border-radius:50%; cursor:pointer;
            color:rgba(255,255,255,0.75);
            transition:background 0.28s,border-color 0.28s,box-shadow 0.28s,transform 0.3s cubic-bezier(0.34,1.5,0.64,1);
            border:1px solid transparent; background:transparent; text-decoration:none;
        }
        .nav-item svg { width:28px; height:28px; display:block; }
        .nav-spacer { flex-shrink:0; width:320px; height:62px; background:#007c85; border-radius:35px; }
        .nav-item:hover,.nav-item.active {
            background:linear-gradient(145deg,rgba(255,255,255,0.30),rgba(255,255,255,0.08));
            backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.38);
            box-shadow:inset 0 1px 0 rgba(255,255,255,0.40),0 6px 16px rgba(0,0,0,0.20);
            transform:scale(1.06); color:#fff;
        }
        .nav-item:hover svg,.nav-item.active svg { color:#fff; filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px rgba(255,255,255,0.9)); }

        .feed-card {
            position:relative; z-index:10;
            background:linear-gradient(145deg,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0.04) 50%,rgba(255,255,255,0.01) 100%);
            backdrop-filter:blur(14px) saturate(1.5); -webkit-backdrop-filter:blur(14px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.18); border-radius:80px; padding:45px 70px;
            box-shadow:0 32px 70px rgba(0,0,0,0.38),inset 0 1px 0 rgba(255,255,255,0.24);
            display:flex; flex-direction:column; width:1180px; max-width:95%;
            height:93vh; max-height:940px;
            animation:cardIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both; animation-delay:0.15s;
        }
        @keyframes cardIn { from{opacity:0;transform:translateY(18px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }

        .feed-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:25px; flex-shrink:0; }
        .feed-title { font-size:32px; color:#fff; letter-spacing:1px; text-transform:uppercase; font-weight:normal; }
        .back-btn {
            background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22);
            border-radius:30px; padding:8px 22px; cursor:pointer;
            font-family:'basis33',monospace; font-size:16px; color:rgba(255,255,255,0.75);
            letter-spacing:1px; text-decoration:none; transition:background 0.25s,color 0.25s;
        }
        .back-btn:hover { background:rgba(255,255,255,0.20); color:#fff; }

        /* ── Табы ────────────────────────────────────── */
        .tabs { display:flex; gap:10px; margin-bottom:24px; flex-shrink:0; }
        .tab-btn {
            background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.20);
            border-radius:30px; padding:8px 24px; cursor:pointer;
            font-family:'basis33',monospace; font-size:18px; color:rgba(255,255,255,0.65);
            letter-spacing:1px; text-transform:uppercase; transition:all 0.25s;
        }
        .tab-btn.active { background:rgba(0,150,157,0.35); border-color:#00969d; color:#fff; box-shadow:0 0 14px rgba(0,150,157,0.4); }
        .tab-btn:hover { background:rgba(255,255,255,0.18); color:#fff; }

        .feed-container { display:flex; flex-direction:column; overflow-y:auto; width:100%; height:100%; scroll-behavior:smooth; }
        .feed-container::-webkit-scrollbar { width:6px; }
        .feed-container::-webkit-scrollbar-thumb { background:rgba(0,150,157,0.4); border-radius:10px; }

        .loading { text-align:center; padding:60px 0; font-family:'basis33',monospace; font-size:22px; color:rgba(255,255,255,0.5); }
        .empty { text-align:center; padding:60px 0; font-family:'basis33',monospace; font-size:20px; color:rgba(255,255,255,0.4); text-transform:uppercase; line-height:1.8; }

        /* ── Фото сетка ──────────────────────────────── */
        .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px; padding-right:10px; }
        .photo-item {
            aspect-ratio:4/3; border-radius:24px; overflow:hidden; cursor:pointer;
            box-shadow:0 4px 16px rgba(0,0,0,0.3);
            transition:transform 0.25s cubic-bezier(0.34,1.5,0.64,1),box-shadow 0.25s;
            position:relative;
        }
        .photo-item:hover { transform:scale(1.04) translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,0.4),0 0 20px rgba(0,150,157,0.25); }
        .photo-item img { width:100%; height:100%; object-fit:cover; }
        .photo-item .photo-date {
            position:absolute; bottom:0; left:0; right:0;
            background:linear-gradient(transparent,rgba(0,0,0,0.7));
            padding:16px 14px 10px; font-family:'basis33',monospace;
            font-size:14px; color:rgba(255,255,255,0.8); letter-spacing:1px;
        }

        /* ── Видео список ────────────────────────────── */
        .video-list { display:flex; flex-direction:column; gap:20px; padding-right:10px; }
        .video-item { border-radius:28px; overflow:hidden; }
        .video-item iframe { width:100%; aspect-ratio:16/9; border:none; display:block; }
        .video-meta { padding:10px 4px 0; font-family:'basis33',monospace; font-size:16px; color:rgba(255,255,255,0.5); letter-spacing:1px; }
    </style>
</head>
<body>
    <div class="top-nav-zone"></div>
    <div class="navbar-container">
        <div class="navbar-inner">
            <a href="search.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
            <a href="news.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></a>
            <div class="nav-spacer"></div>
            <a href="create.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></a>
            <a href="profile.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
        </div>
    </div>

    <div class="feed-card">
        <div class="feed-header">
            <h2 class="feed-title">Мои медиа</h2>
            <a href="profile.html" class="back-btn">← Профиль</a>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('photos')">Фото</button>
            <button class="tab-btn" onclick="switchTab('videos')">Видео</button>
        </div>
        <div class="feed-container" id="feedContainer">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const user = getCurrentUser();
        let allPhotos = [], allVideos = [], currentTab = 'photos';

        window.addEventListener('load', async () => {
            requestAnimationFrame(() => document.body.classList.add('loaded'));
            if (!user) { goTo('index.html'); return; }
            await loadMedia();
        });

        async function loadMedia() {
            try {
                const posts = await sbSelect('posts',
                    `author_id=eq.${user.id}&select=id,date,video_url,created_at`
                );
                if (!posts.length) { showEmpty(); return; }

                const postIds = posts.map(p => p.id).join(',');
                const photos  = await sbSelect('photos', `post_id=in.(${postIds})&select=post_id,url`);

                // Соединяем фото с датой поста
                allPhotos = photos.map(ph => {
                    const post = posts.find(p => p.id === ph.post_id);
                    return { url: ph.url, date: post?.date || '', created_at: post?.created_at || '' };
                }).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

                allVideos = posts.filter(p => p.video_url)
                    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

                renderTab();
            } catch(e) {
                document.getElementById('feedContainer').innerHTML = '<div class="empty">Ошибка загрузки</div>';
                console.error(e);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', (i === 0 && tab === 'photos') || (i === 1 && tab === 'videos'));
            });
            renderTab();
        }

        function renderTab() {
            const container = document.getElementById('feedContainer');
            if (currentTab === 'photos') {
                if (!allPhotos.length) { container.innerHTML = '<div class="empty">Нет загруженных фото</div>'; return; }
                container.innerHTML = '<div class="photo-grid" id="photoGrid"></div>';
                const grid = document.getElementById('photoGrid');
                allPhotos.forEach(ph => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    div.innerHTML = `<img src="${ph.url}" alt="" loading="lazy"><div class="photo-date">${escHtml(ph.date)}</div>`;
                    div.onclick = () => window.open(ph.url, '_blank');
                    grid.appendChild(div);
                });
            } else {
                if (!allVideos.length) { container.innerHTML = '<div class="empty">Нет загруженных видео</div>'; return; }
                container.innerHTML = '<div class="video-list" id="videoList"></div>';
                const list = document.getElementById('videoList');
                allVideos.forEach(post => {
                    const id = extractYTId(post.video_url);
                    if (!id) return;
                    const div = document.createElement('div');
                    div.className = 'video-item';
                    div.innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
                        <div class="video-meta">${escHtml(post.date)} · ${timeAgo(post.created_at)}</div>
                    `;
                    list.appendChild(div);
                });
            }
        }

        function showEmpty() {
            document.getElementById('feedContainer').innerHTML = '<div class="empty">Вы ещё ничего не публиковали<br>Нажмите + чтобы создать историю</div>';
        }

        function extractYTId(url) {
            try {
                const u = new URL(url);
                if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('?')[0];
                return u.searchParams.get('v') || '';
            } catch { return /^[\w-]{11}$/.test(url) ? url : ''; }
        }
        function escHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        document.querySelectorAll('a[href]').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('http') && !href.startsWith('mailto')) {
                    e.preventDefault(); goTo(href);
                }
            });
        });
    </script>
</body>
</html>
